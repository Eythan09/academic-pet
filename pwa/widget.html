<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erudax — виджет</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=4">
  <style>
    /* Виджет статуса Claude Code (DESIGN.md, раздел 7). Статусы пока переключаются вручную. */
    body { display: grid; place-items: center; min-height: 100dvh; padding: 16px; font-family: "Segoe UI", system-ui, sans-serif; }
    .widget {
      width: 440px; max-width: 100%; min-height: 260px; padding: 16px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px; display: flex; flex-direction: column; gap: 12px;
    }
    .w-head { display: flex; justify-content: space-between; align-items: baseline; }
    .w-name { font: 700 16px var(--font-px); letter-spacing: 1px; }
    .w-sub { font-size: 12px; color: var(--muted); }
    .w-body { display: flex; gap: 16px; align-items: stretch; }
    .w-scene {
      width: 140px; height: 140px; flex-shrink: 0; border: 2px solid var(--ink); border-radius: 12px;
      display: flex; align-items: center; justify-content: center; overflow: hidden; background-size: 6px 6px;
    }
    .w-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .w-kicker { font: 12px var(--font-px); color: var(--muted); letter-spacing: 1px; }
    .w-status { font: 700 26px/1 var(--font-px); }
    .w-status.hot { color: var(--accent); }
    .w-text { font-size: 13px; color: #B5B5B5; line-height: 1.35; }
    .w-tabs { margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .w-tabs button {
      height: 36px; border-radius: 8px; border: 1px solid #3A3A3A; background: transparent; color: var(--ink);
      font: 600 12px "Segoe UI", system-ui, sans-serif; cursor: pointer;
    }
    .w-tabs button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
    .w-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; padding-top: 10px; border-top: 1px solid var(--line); }
    .w-next { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .w-timer { font: 600 13px var(--font-px); color: var(--accent); white-space: nowrap; }
    .w-timer.calm { color: var(--ink); }
    @media (max-width: 420px) { .w-body { flex-direction: column; align-items: center; } .w-info { align-self: stretch; } }
  </style>
</head>
<body>
  <div class="widget">
    <div class="w-head">
      <span class="w-name" id="wName">Erudax</span>
      <span class="w-sub">поверх окон</span>
    </div>
    <div class="w-body">
      <div class="w-scene tone"><div class="pet-wrap" id="wPetWrap"><canvas id="wPet"></canvas></div></div>
      <div class="w-info">
        <span class="w-kicker">CLAUDE CODE</span>
        <span class="w-status" id="wStatus">ДУМАЕТ…</span>
        <span class="w-text" id="wText"></span>
        <div class="w-tabs" role="group" aria-label="Статус Claude Code" id="wTabs"></div>
      </div>
    </div>
    <div class="w-foot">
      <span class="w-next" id="wNext">Ближайший: —</span>
      <span class="w-timer" id="wTimer"></span>
    </div>
  </div>

  <script src="pet.js?v=4"></script>
  <script>
    "use strict";
    // Подключение к Claude Code будет позже; пока статус выбирается кнопками и запоминается.
    const STATUSES = {
      thinking: { label: "ДУМАЕТ…", text: "Пишет код. Не мешаю, но слежу за каждым файлом.", mood: "happy", anim: "a-bob", tab: "Думает" },
      waiting: { label: "ЖДЁТ ТЕБЯ", text: "Нужен твой ответ в терминале. Эй, ты где?", mood: "worried", anim: "a-tremble", tab: "Ждёт", hot: true },
      finished: { label: "ЗАКОНЧИЛ", text: "Готово! Проверь, что он там натворил.", mood: "done", anim: "a-jump", tab: "Закончил" },
    };
    const get = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } };
    const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
    const $ = (id) => document.getElementById(id);
    let status = get("widgetStatus", "thinking");
    if (!STATUSES[status]) status = "thinking";
    const name = get("petName", "Erudax") === "Пиксель" ? "Erudax" : get("petName", "Erudax");
    const levelNow = Math.floor(get("xp", 0) / 50) + 1;

    function fmtLeft(h) {
      if (h < 0) return "просрочено";
      if (h < 1) return "< 1 ч";
      if (h < 24) return `${Math.floor(h)} ч`;
      const d = Math.floor(h / 24), r = Math.floor(h % 24);
      return r ? `${d} д ${r} ч` : `${d} д`;
    }

    function render() {
      const s = STATUSES[status];
      $("wName").textContent = name;
      $("wStatus").textContent = s.label;
      $("wStatus").classList.toggle("hot", !!s.hot);
      $("wText").textContent = s.text;
      $("wPetWrap").className = `pet-wrap ${s.anim}`;
      ErudaxPet.draw($("wPet"), { level: levelNow, mood: s.mood, px: 6, name });
      $("wTabs").replaceChildren(...Object.entries(STATUSES).map(([k, v]) => {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = v.tab;
        b.setAttribute("aria-pressed", String(k === status));
        b.addEventListener("click", () => { status = k; set("widgetStatus", k); render(); });
        return b;
      }));
    }

    async function loadNext() {
      let list = get("cache", { deadlines: [] }).deadlines;
      try {
        const res = await fetch(`deadlines.json?t=${Date.now()}`, { cache: "no-store" });
        if (res.ok) list = (await res.json()).deadlines || [];
      } catch {}
      const done = get("done", {});
      const now = Date.now();
      const next = list.filter((d) => !done[d.id] && new Date(d.due).getTime() > now)
        .sort((a, b) => new Date(a.due) - new Date(b.due))[0];
      if (!next) { $("wNext").textContent = "Ближайший: нет"; $("wTimer").textContent = ""; return; }
      const h = (new Date(next.due).getTime() - now) / 3600000;
      $("wNext").textContent = `Ближайший: ${next.title} · ${next.course}`;
      $("wTimer").textContent = fmtLeft(h);
      $("wTimer").classList.toggle("calm", h >= 24);
    }

    render();
    loadNext();
    setInterval(loadNext, 5 * 60 * 1000);
  </script>
</body>
</html>
