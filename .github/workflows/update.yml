# Каждые 30 минут: проверка Академо → pwa/deadlines.json → Web Push → GitHub Pages.
# Раз в неделю: keepalive, чтобы GitHub не отключил расписание через 60 дней без активности.
name: Update deadlines

on:
  schedule:
    - cron: "7,37 * * * *"   # проверка дедлайнов; не ровно :00/:30 — в эти минуты GitHub чаще задерживает запуски
    - cron: "23 4 * * 1"     # keepalive, по понедельникам
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_push:
        description: "Отправить тестовое уведомление на все подписки"
        type: boolean
        default: false

permissions:
  contents: write   # коммит deadlines.json
  pages: write      # публикация PWA
  id-token: write   # нужно deploy-pages
  actions: write    # keepalive: повторное включение расписания

concurrency:
  group: update-deadlines
  cancel-in-progress: false

jobs:
  update:
    if: github.event.schedule != '23 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: updater/requirements.txt

      - name: Install dependencies
        run: pip install -r updater/requirements.txt pytest

      - name: Tests
        if: github.event_name == 'push'
        run: python -m pytest -q updater/tests

      - name: Check Academo
        id: check
        env:
          ACADEMO_USERNAME: ${{ secrets.ACADEMO_USERNAME }}
          ACADEMO_PASSWORD: ${{ secrets.ACADEMO_PASSWORD }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          TEST_PUSH: ${{ inputs.test_push }}
        run: python updater/update.py

      - name: Commit if something changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa/deadlines.json data/state.json
          if git diff --cached --quiet; then
            echo "Нечего коммитить"
            exit 0
          fi
          git commit -m "Обновить дедлайны"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1

  deploy:
    needs: update
    # Публикуем, когда изменились дедлайны или код (push / ручной запуск).
    # !cancelled(): сайт обновится, даже если Академо в этот раз не ответил
    if: ${{ !cancelled() && (needs.update.outputs.changed == 'true' || github.event_name != 'schedule') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # берём свежий коммит с обновлёнными дедлайнами

      - name: Write PWA config
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          printf 'window.APP_CONFIG = { vapidPublicKey: "%s" };\n' "$VAPID_PUBLIC_KEY" > pwa/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa
      - id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    if: github.event.schedule == '23 4 * * 1'
    runs-on: ubuntu-latest
    steps:
      # Повторное включение сбрасывает 60-дневный счётчик неактивности (без лишних коммитов)
      - name: Re-enable scheduled workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

      # Подстраховка: если коммитов не было 45 дней, делаем пустой коммит
      - uses: actions/checkout@v4
      - name: Empty commit if repo is idle
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Последний коммит $age_days дн. назад"
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: не даём GitHub отключить расписание"
            git push
          fi
